<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>台美股看盤</title>
<script>try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar">
  <h1><a href="index.html">台美股看盤</a></h1>
  <nav><a href="index.html">追蹤清單</a><a href="compare.html">比較</a></nav>
</header>
<div class="tape" id="tape"></div>

<main class="wide">
  <div class="toolbar">
    <div class="seg mk-tabs" role="tablist" aria-label="市場">
      <button type="button" role="tab" data-mk="tw">台股</button>
      <button type="button" role="tab" data-mk="us">美股</button>
    </div>
    <span id="tw-live"></span>
    <button type="button" class="btn" id="hold-btn">📥 匯入庫存</button>
    <div class="view-wrap">
    <span class="view-label" id="view-label">畫面顯示：</span>
    <div class="seg view-btns" role="group" aria-labelledby="view-label">
      <button type="button" data-view="small" title="小方塊" aria-label="小方塊">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="4" height="4"/><rect x="6" y="1" width="4" height="4"/><rect x="11" y="1" width="4" height="4"/><rect x="1" y="6" width="4" height="4"/><rect x="6" y="6" width="4" height="4"/><rect x="11" y="6" width="4" height="4"/><rect x="1" y="11" width="4" height="4"/><rect x="6" y="11" width="4" height="4"/><rect x="11" y="11" width="4" height="4"/></svg>
      </button>
      <button type="button" data-view="large" title="大方塊" aria-label="大方塊">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="6.5" height="6.5"/><rect x="8.5" y="1" width="6.5" height="6.5"/><rect x="1" y="8.5" width="6.5" height="6.5"/><rect x="8.5" y="8.5" width="6.5" height="6.5"/></svg>
      </button>
      <button type="button" data-view="list" title="清單" aria-label="清單">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="2" width="14" height="2.4"/><rect x="1" y="6.8" width="14" height="2.4"/><rect x="1" y="11.6" width="14" height="2.4"/></svg>
      </button>
    </div>
    </div>
  </div>
  <!-- 每個市場一個分頁：方塊模式看 .grid，清單模式看 .list-pane（欄位與全台股總表相同＋近一年走勢） -->
  <section id="pane-tw" role="tabpanel">
    <div class="hold-sum" id="tw-hsum" hidden></div>
    <div class="grid" id="tw"></div>
    <div class="list-pane" id="tw-list"></div>
  </section>
  <section id="pane-us" role="tabpanel" hidden>
    <div class="hold-sum" id="us-hsum" hidden></div>
    <div class="grid" id="us"></div>
    <div class="list-pane" id="us-list"></div>
  </section>
</main>

<dialog id="add-dlg" aria-labelledby="add-title">
  <form method="dialog" class="dlg">
    <h3 id="add-title">加入追蹤</h3>
    <input type="search" id="add-q" placeholder="輸入代號或名稱，例：2454、聯發科、TSLA" autocomplete="off" aria-label="輸入代號或名稱">
    <ul id="add-list" class="pick-list"></ul>
    <p id="add-msg" class="updated" role="status"></p>
    <div class="dlg-foot"><button class="btn" value="cancel">關閉</button></div>
  </form>
</dialog>

<!-- 匯入庫存：持股只存在這台裝置的瀏覽器（assets/holdings.js） -->
<dialog id="hold-dlg" class="hold-dlg" aria-labelledby="hold-title">
  <form method="dialog" class="dlg">
    <h3 id="hold-title">匯入庫存</h3>
    <p class="updated">持股只存在這台裝置的瀏覽器，不會上傳到 GitHub。換電腦或手機要再匯入一次，可以用「備份」存成 CSV 帶過去。</p>
    <div id="hold-step1">
      <textarea id="hold-text" rows="7" spellcheck="false" aria-label="貼上庫存"
        placeholder="在 YesWin／XQ 的庫存表格全選複製，貼在這裡（含標題列）。&#10;也可以自己打，一行一檔：代號 股數 成本均價&#10;2330 1000 550.5&#10;0050 2000&#10;AAPL 10 180"></textarea>
      <div class="hold-row">
        <label class="btn">選擇檔案<input type="file" id="hold-file" accept=".csv,.txt,.xls,.xlsx,.pdf" hidden></label>
        <span class="updated">CSV、Excel、集保 e 手掌握 PDF</span>
        <button type="button" class="btn primary" id="hold-parse">解析</button>
      </div>
    </div>
    <div id="hold-step2" hidden>
      <div id="hold-preview"></div>
      <div class="hold-opts">
        <label><input type="radio" name="hold-mode" value="replace" checked> 取代目前持股</label>
        <label><input type="radio" name="hold-mode" value="merge"> 和目前持股相加</label>
        <label id="hold-addw-wrap"><input type="checkbox" id="hold-addw" checked> <span id="hold-addw-text"></span></label>
      </div>
    </div>
    <p id="hold-msg" class="updated" role="status"></p>
    <div class="dlg-foot hold-foot">
      <span class="hold-cur" id="hold-cur"></span>
      <button type="button" class="btn" id="hold-back" hidden>重新貼上</button>
      <button class="btn" value="cancel">關閉</button>
      <button type="button" class="btn primary" id="hold-save" hidden>匯入</button>
    </div>
  </form>
</dialog>

<footer>
  資料僅供參考，不構成投資建議。資料來源：TradingView、FinMind、公開資訊觀測站、SEC、Yahoo Finance。
</footer>

<script src="assets/app.js"></script>
<script src="assets/layout.js"></script>
<script src="assets/search.js"></script>
<script src="assets/widgets.js"></script>
<script src="assets/refs.js"></script>
<script src="assets/stockcols.js"></script>
<script src="assets/live.js"></script>
<script src="assets/holdings.js"></script>
<script>
(async function () {
  let w;
  try {
    w = await App.loadWatchlist();
  } catch (e) {
    document.querySelector("main").innerHTML = '<p class="msg">讀不到追蹤清單（config/watchlist.json）。</p>';
    return;
  }
  ownTape(document.getElementById("tape"));
  const twCards = new Map();  // 台股代號 → 卡片的走勢區（盤中即時更新用）
  const lastQ = {};           // 台股代號 → 最新的富果即時報價
  const hold = Holdings.load();   // 持股（只存在這台裝置）
  const px = { tw: {}, us: {} };  // 持股損益用的最新股價

  function addCards(list, el, m) {
    for (const item of list) {
      const sym = App.symbolOf(item);
      const a = document.createElement("a");
      a.className = "card";
      a.href = "stock.html?symbol=" + encodeURIComponent(sym) + "&m=" + m;
      a.innerHTML = '<div class="card-head"><strong></strong><span></span></div>' +
        (hold[m][sym] ? '<div class="hold-line" data-k="' + m + ":" + App.esc(sym) + '"></div>' : "") + '<div class="mini"></div>' +
        '<button type="button" class="rm" title="從追蹤清單移除">×</button>';
      a.querySelector("strong").textContent = item.name;
      a.querySelector("span").textContent = sym;
      a.querySelector(".rm").setAttribute("aria-label", "從追蹤清單移除 " + item.name);
      a.querySelector(".rm").addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); removeStock(m, item, a); });
      el.appendChild(a);
      if (m === "tw") twCards.set(sym, a.querySelector(".mini"));
      ownMini(a.querySelector(".mini"), item);
    }
    // 最後一格是「＋」：加入新的追蹤股票
    const add = document.createElement("button");
    add.type = "button";
    add.className = "card add-card";
    add.innerHTML = '<span class="plus">＋</span><span>加入' + (m === "tw" ? "台股" : "美股") + "</span>";
    add.addEventListener("click", () => openAdd(m));
    el.appendChild(add);
  }

  // ---------- 加入／移除（寫回 GitHub 上的 config/watchlist.json） ----------
  const dlg = document.getElementById("add-dlg"), addQ = document.getElementById("add-q");
  const addList = document.getElementById("add-list"), addMsg = document.getElementById("add-msg");
  let addMarket = "tw", picks = [], busy = false;
  function openAdd(m) {
    addMarket = m;
    addQ.value = "";
    addList.innerHTML = "";
    addMsg.textContent = m === "tw" ? "台股上市、上櫃都可以加入。" : "美股 Nasdaq、NYSE 都可以加入。";
    dlg.showModal();
    addQ.focus();
    App.loadStockList().catch(() => {});
  }
  let st;
  addQ.addEventListener("input", () => { clearTimeout(st); st = setTimeout(searchAdd, 120); });
  addQ.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); if (picks[0]) addStock(picks[0]); } });
  async function searchAdd() {
    const q = addQ.value.trim();
    if (!q) { addList.innerHTML = ""; return; }
    const res = (await App.searchStocks(q, 40)).filter((r) => r.m === addMarket).slice(0, 8);
    if (addQ.value.trim() !== q) return;
    picks = res;
    const have = new Set((addMarket === "tw" ? w.tw : w.us).map((x) => App.symbolOf(x).toUpperCase()));
    addList.innerHTML = res.length ? res.map((r, i) =>
      '<li><button type="button" data-i="' + i + '"' + (have.has(r.symbol) ? " disabled" : "") + "><b>" + App.esc(r.symbol) + "</b> " + App.esc(r.name) +
      ' <span>' + App.esc(r.tag) + (have.has(r.symbol) ? "・已在清單" : "") + "</span></button></li>").join("") : '<li class="empty">找不到符合的股票</li>';
  }
  addList.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-i]");
    if (b && !b.disabled) addStock(picks[+b.dataset.i]);
  });
  async function addStock(r) {
    if (busy) return;
    busy = true;
    addMsg.textContent = "加入 " + r.symbol + " " + r.name + " 中…";
    try {
      await App.editWatchlist("add", r.m, r.item);
      addMsg.textContent = "已加入 " + r.symbol + " " + r.name + "。完整資料約 2～3 分鐘後產生，之後每天自動更新。";
      setTimeout(() => location.reload(), 1200);
    } catch (err) {
      addMsg.textContent = "⚠ " + err.message;
      busy = false;
    }
  }
  async function removeStock(m, item, card) {
    if (!confirm("從追蹤清單移除「" + item.name + "（" + App.symbolOf(item) + "）」？")) return;
    card.classList.add("busy");
    try {
      await App.editWatchlist("remove", m, item);
      // 清單模式移除後重新整理（卡片和表格都要更新）；方塊模式直接拿掉卡片
      if (card.tagName === "TR") location.reload();
      else card.remove();
    } catch (err) {
      card.classList.remove("busy");
      alert(err.message);
    }
  }

  // 頁首報價列：讀 summary.json（紅漲綠跌）；讀不到就退回 TradingView 跑馬燈
  async function ownTape(host) {
    let s;
    try { s = await App.loadJSON("data/summary.json"); } catch (e) { return TV.tickerTape(host, [...w.tw, ...w.us]); }
    const one = s.stocks.map((x) =>
      '<a href="stock.html?symbol=' + encodeURIComponent(x.symbol) + '"><b>' + App.esc(x.name) + "</b> " +
      (x.market === "US" ? "$" : "") + App.fmtPrice(x.price) +
      ' <span class="' + App.upDown(x.change_pct) + '">' + App.fmtPct(x.change_pct, true) + "</span></a>").join("");
    // 股票少時重複幾次，讓半條就比螢幕寬（約 16 檔以上），循環時右邊才不會出現空白
    const reps = Math.max(1, Math.ceil(16 / Math.max(1, s.stocks.length)));
    const half = one.repeat(reps);
    // 內容放兩份、整條往左移一半，接起來就是無縫循環；每檔約 4 秒，速度固定
    host.innerHTML = '<div class="own-tape"><div class="track" style="animation-duration:' + (s.stocks.length * reps * 4) + 's">' +
      '<span class="dup">' + half + '</span><span aria-hidden="true" class="dup">' + half + "</span></div></div>";
    host.querySelectorAll('[aria-hidden="true"] a').forEach((a) => a.tabIndex = -1);
  }

  // 卡片：用自己的日 K 資料畫近一年走勢（紅漲綠跌）
  // 剛加入、排程還沒產生資料檔的股票先即時查詢；都失敗才退回 TradingView
  // 每檔的日 K 資料只抓一次（方塊卡片和清單走勢圖共用）
  const dataCache = {};
  function stockData(item) {
    const key = App.marketOf(item) + ":" + App.symbolOf(item);
    if (!dataCache[key]) {
      dataCache[key] = App.loadStockData(item).catch(() => App.loadLiveData(item)).catch((e) => { delete dataCache[key]; throw e; });
    }
    return dataCache[key];
  }

  async function ownMini(host, item) {
    let d;
    try { d = await stockData(item); } catch (e) { return TV.miniOverview(host, item); }
    const c = d.price.close.slice(-250), dates = d.price.dates.slice(-250), n = c.length;
    if (n < 2) return TV.miniOverview(host, item);
    setPx(App.marketOf(item), App.symbolOf(item), c[n - 1]);
    const diff = c[n - 1] - c[n - 2], pct = diff / c[n - 2] * 100;
    const yearCls = App.upDown(c[n - 1] - c[0]);
    const min = Math.min(...c), max = Math.max(...c), W = 300, H = 100;
    const pts = c.map((x, i) => (i / (n - 1) * W).toFixed(1) + "," + (H - (x - min) / (max - min || 1) * H).toFixed(1)).join(" ");
    host.innerHTML =
      '<div class="own-mini">' +
        '<div><span class="px ' + App.upDown(diff) + '">' + (d.market === "US" ? "$" : "") + App.fmtPrice(c[n - 1]) + '</span>' +
        '<span class="chg ' + App.upDown(diff) + '">' + App.fmtPct(pct, true) + '</span></div>' +
        '<div class="sub">' + (d._live ? (d._live.closed ? "收盤 " : "盤中 ") + App.esc(d._live.date) : "收盤 " + App.esc(dates[n - 1])) + "・近一年 " + App.fmtPct((c[n - 1] / c[0] - 1) * 100, true) + "</div>" +
        '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" aria-hidden="true">' +
          '<polyline points="' + pts + '" fill="none" stroke="var(--' + (yearCls || "muted") + ')" stroke-width="1.6" vector-effect="non-scaling-stroke"/>' +
        "</svg>" +
      "</div>";
  }

  // ---------- 持股：股數、成本、損益（只存在這台裝置的瀏覽器） ----------
  // 價格來源：盤中即時 > 個股日 K 最後一筆 > 全台股總表／summary.json（不在追蹤清單的持股也用得到）
  function setPx(m, code, p, weak) {
    if (!App.isNum(p) || (weak && App.isNum(px[m][code]))) return;
    if (px[m][code] === p) return;
    px[m][code] = p;
    clearTimeout(holdTimer);
    holdTimer = setTimeout(renderHold, 50);
  }
  let holdTimer;
  async function loadHoldPrices() {
    if (Holdings.count(hold, "tw")) {
      try { const all = await Refs.load(); for (const code of Object.keys(hold.tw)) setPx("tw", code, all.byCode[code] && all.byCode[code].close, true); } catch (e) {}
    }
    if (Holdings.count(hold, "us")) {
      try {
        const sum = await App.loadJSON("data/summary.json");
        for (const x of sum.stocks || []) if (x.market === "US" && hold.us[x.symbol]) setPx("us", x.symbol, x.price, true);
      } catch (e) {}
    }
    renderHold();
  }
  const money = (m, n, signed) => (App.isNum(n) ? (signed && n > 0 ? "+" : n < 0 ? "−" : "") + (m === "us" ? "$" : "") + App.fmtNum(Math.abs(n), m === "us" ? 2 : 0) : "—");
  const shareFmt = (n) => (App.isNum(n) ? n.toLocaleString("zh-TW", { maximumFractionDigits: 4 }) : "—");
  function plHtml(m, c) {
    if (!App.isNum(c.pl)) return '<span class="updated">損益 —</span>';
    return '<span class="' + App.upDown(c.pl) + '">損益 ' + money(m, c.pl, true) + "（" + App.fmtPct(c.pct, true) + "）</span>";
  }
  function holdingCols(m) {
    return [
      { k: "h_shares", t: "持股(股)", f: (s) => shareFmt(s.h_shares) },
      { k: "h_avg", t: "成本均價", asc: true, f: (s) => (App.isNum(s.h_avg) ? (m === "us" ? "$" : "") + App.fmtNum(s.h_avg, 2) : "—") },
      { k: "h_mv", t: "持股市值", f: (s) => money(m, s.h_mv) },
      { k: "h_pl", t: "未實現損益", f: (s) => '<span class="' + App.upDown(s.h_pl) + '">' + money(m, s.h_pl, true) + "</span>" },
      { k: "h_pct", t: "報酬率", f: (s) => StockCols.pctCell(s.h_pct) },
    ];
  }
  function renderHold() {
    // 卡片上的持股列
    document.querySelectorAll(".hold-line").forEach((el) => {
      const [m, code] = el.dataset.k.split(":");
      const e = hold[m][code];
      if (!e) return;
      const c = Holdings.calc(e, px[m][code]);
      el.innerHTML = "<span>持有 " + shareFmt(e.shares) + " 股" + (App.isNum(c.avg) ? "・均 " + App.fmtNum(c.avg, 2) : "") + "</span> " + plHtml(m, c);
    });
    // 每個分頁上方的總計
    for (const m of ["tw", "us"]) {
      const el = document.getElementById(m + "-hsum"), codes = Object.keys(hold[m]);
      el.hidden = !codes.length;
      if (!codes.length) continue;
      let mv = 0, cost = 0, mvC = 0, noPx = 0, noCost = 0;
      const inW = new Set(w[m].map((x) => App.symbolOf(x).toUpperCase()));
      for (const code of codes) {
        const e = hold[m][code], p = px[m][code];
        if (!App.isNum(p)) { noPx++; continue; }
        mv += p * e.shares;
        if (App.isNum(e.cost) && e.cost > 0) { cost += e.cost; mvC += p * e.shares; } else noCost++;
      }
      const pl = cost ? mvC - cost : null;
      const notes = [];
      const outside = codes.filter((c) => !inW.has(c)).length;
      if (outside) notes.push(outside + " 檔不在追蹤清單");
      if (noPx) notes.push(noPx + " 檔沒有股價，未計入");
      if (noCost) notes.push(noCost + " 檔沒有成本，損益未計入");
      notes.push("損益未扣賣出手續費與稅");
      el.innerHTML =
        "<div><span>持股 <b>" + codes.length + "</b> 檔</span>" +
        "<span>市值 <b>" + money(m, mv) + "</b></span>" +
        "<span>成本 <b>" + (cost ? money(m, cost) : "—") + "</b></span>" +
        '<span>未實現損益 <b class="' + App.upDown(pl) + '">' + (pl == null ? "—" : money(m, pl, true) + "（" + App.fmtPct(pl / cost * 100, true) + "）") + "</b></span></div>" +
        '<div class="updated">' + notes.join("・") + "</div>";
    }
  }

  // 匯入對話框
  const hd = {
    dlg: document.getElementById("hold-dlg"), text: document.getElementById("hold-text"), file: document.getElementById("hold-file"),
    step1: document.getElementById("hold-step1"), step2: document.getElementById("hold-step2"), preview: document.getElementById("hold-preview"),
    msg: document.getElementById("hold-msg"), save: document.getElementById("hold-save"), back: document.getElementById("hold-back"),
    cur: document.getElementById("hold-cur"), addw: document.getElementById("hold-addw"), addwWrap: document.getElementById("hold-addw-wrap"),
    addwText: document.getElementById("hold-addw-text"),
  };
  let parsed = null, holdBusy = false;
  function holdStep(n) {
    hd.step1.hidden = n !== 1; hd.step2.hidden = n !== 2;
    hd.save.hidden = n !== 2; hd.back.hidden = n !== 2;
  }
  function holdCur() {
    const t = Holdings.count(hold, "tw"), u = Holdings.count(hold, "us");
    hd.cur.innerHTML = t + u ? "目前持股：台股 " + t + "、美股 " + u + ' 檔 <button type="button" class="linkish" data-act="backup">備份</button> <button type="button" class="linkish" data-act="clear">清除</button>' : "目前沒有持股資料";
  }
  document.getElementById("hold-btn").addEventListener("click", () => {
    holdStep(1); hd.msg.textContent = ""; hd.file.value = ""; holdCur();
    hd.dlg.showModal();
    App.loadStockList().catch(() => {});
  });
  hd.cur.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-act]");
    if (!b) return;
    if (b.dataset.act === "backup") {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([Holdings.toCsv(hold)], { type: "text/csv" }));
      a.download = "持股備份_" + new Date().toISOString().slice(0, 10) + ".csv";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    } else if (confirm("清除這台裝置上的全部持股資料？（追蹤清單不受影響）")) {
      hold.tw = {}; hold.us = {};
      try { Holdings.save(hold); } catch (err) {}
      location.reload();
    }
  });
  async function runParse(getRows) {
    hd.msg.textContent = "解析中…";
    try {
      const [rows, list] = await Promise.all([getRows(), App.loadStockList()]);
      parsed = Holdings.parseRows(rows, list);
    } catch (err) { hd.msg.textContent = "⚠ " + err.message; return; }
    if (!parsed.items.length) {
      hd.msg.textContent = "⚠ 找不到持股。" + (parsed.skipped.length ? "略過：" + parsed.skipped.slice(0, 3).map((x) => x.text.slice(0, 30) + "（" + x.why + "）").join("；") : "") + " 請確認有代號或名稱、股數兩欄。";
      return;
    }
    hd.msg.textContent = "";
    showPreview();
  }
  document.getElementById("hold-parse").addEventListener("click", () => {
    if (!hd.text.value.trim()) { hd.msg.textContent = "請先貼上庫存，或選擇檔案。"; return; }
    runParse(async () => Holdings.textRows(hd.text.value));
  });
  hd.file.addEventListener("change", () => { if (hd.file.files[0]) runParse(() => Holdings.fileRows(hd.file.files[0])); });
  hd.back.addEventListener("click", () => { holdStep(1); hd.msg.textContent = ""; hd.file.value = ""; });

  function showPreview() {
    const inW = { tw: new Set(w.tw.map((x) => x.code)), us: new Set(w.us.map((x) => x.ticker.toUpperCase())) };
    hd.preview.innerHTML =
      '<div class="table-wrap hold-table"><table><thead><tr><th></th><th class="l">代號</th><th class="l">名稱</th><th>股數</th><th>成本均價</th><th>總成本</th></tr></thead><tbody>' +
      parsed.items.map((it, i) =>
        '<tr data-i="' + i + '"><td><input type="checkbox" checked aria-label="匯入 ' + App.esc(it.name) + '"></td>' +
        '<td class="l">' + App.esc(it.code) + (it.m === "us" ? ' <span class="tag-us">美</span>' : "") + "</td>" +
        '<td class="l">' + App.esc(it.name) + (inW[it.m].has(it.code) ? "" : ' <span class="updated">新</span>') + "</td>" +
        '<td><input type="number" class="h-sh" min="0" step="any" value="' + it.shares + '" aria-label="股數"></td>' +
        '<td><input type="number" class="h-avg" min="0" step="any" value="' + (it.cost != null ? +(it.cost / it.shares).toFixed(4) : "") + '" placeholder="不填" aria-label="成本均價"></td>' +
        '<td class="h-cost">' + (it.cost != null ? money(it.m, it.cost) : "—") + "</td></tr>").join("") +
      "</tbody></table></div>" +
      (parsed.skipped.length ? '<details class="updated"><summary>略過 ' + parsed.skipped.length + " 列</summary>" +
        parsed.skipped.map((x) => "<div>" + App.esc(x.text.slice(0, 60)) + "（" + x.why + "）</div>").join("") + "</details>" : "");
    hd.preview.oninput = (e) => {
      const tr = e.target.closest("tr[data-i]");
      if (!tr) return;
      const it = parsed.items[+tr.dataset.i];
      const sh = parseFloat(tr.querySelector(".h-sh").value), avg = parseFloat(tr.querySelector(".h-avg").value);
      if (e.target.classList.contains("h-sh")) {
        const oldAvg = it.cost != null ? it.cost / it.shares : null;
        if (sh > 0) { it.shares = sh; if (oldAvg != null) it.cost = oldAvg * sh; }
      } else if (e.target.classList.contains("h-avg")) {
        it.cost = avg > 0 ? avg * it.shares : null;
      }
      tr.querySelector(".h-cost").textContent = it.cost != null ? money(it.m, it.cost) : "—";
      updateAddw();
    };
    hd.preview.onchange = updateAddw;
    updateAddw();
    holdStep(2);
  }
  function chosen() {
    return [...hd.preview.querySelectorAll("tr[data-i]")].filter((tr) => tr.querySelector("input[type=checkbox]").checked).map((tr) => parsed.items[+tr.dataset.i]);
  }
  function newOnes() {
    const inW = { tw: new Set(w.tw.map((x) => x.code)), us: new Set(w.us.map((x) => x.ticker.toUpperCase())) };
    return chosen().filter((it) => !inW[it.m].has(it.code));
  }
  function updateAddw() {
    const n = newOnes().length;
    hd.addwWrap.hidden = !n;
    hd.addwText.textContent = "不在追蹤清單的 " + n + " 檔一起加入追蹤清單";
    hd.save.textContent = "匯入 " + chosen().length + " 檔";
  }
  hd.save.addEventListener("click", async () => {
    if (holdBusy) return;
    const items = chosen();
    if (!items.length) { hd.msg.textContent = "請至少勾選一檔。"; return; }
    const mode = hd.dlg.querySelector('input[name="hold-mode"]:checked').value;
    const next = { tw: mode === "replace" ? {} : Object.assign({}, hold.tw), us: mode === "replace" ? {} : Object.assign({}, hold.us) };
    for (const it of items) {
      const prev = next[it.m][it.code];
      const e = { name: it.name, shares: it.shares, cost: it.cost };
      if (it.m === "tw") e.market = it.market; else e.exchange = it.exchange;
      if (prev) { e.shares += prev.shares; e.cost = prev.cost != null && it.cost != null ? prev.cost + it.cost : null; }
      next[it.m][it.code] = e;
    }
    try { Holdings.save(next); } catch (err) { hd.msg.textContent = "⚠ 瀏覽器不能儲存（可能是無痕模式）：" + err.message; return; }
    const add = hd.addw.checked ? newOnes() : [];
    if (!add.length) { hd.msg.textContent = "已匯入 " + items.length + " 檔。"; setTimeout(() => location.reload(), 600); return; }
    holdBusy = true;
    hd.msg.textContent = "持股已存好。加入追蹤清單中…";
    try {
      for (const m of ["tw", "us"]) {
        const list = add.filter((it) => it.m === m).map((it) => (m === "tw" ? { code: it.code, name: it.name, market: it.market } : { ticker: it.code, name: it.name, exchange: it.exchange }));
        if (list.length) await App.editWatchlist("add", m, list);
      }
      hd.msg.textContent = "已匯入 " + items.length + " 檔，新增 " + add.length + " 檔到追蹤清單（完整資料約 2～3 分鐘後產生）。";
      setTimeout(() => location.reload(), 1500);
    } catch (err) {
      hd.msg.textContent = "持股已存好，但加入追蹤清單失敗：" + err.message;
      holdBusy = false;
    }
  });

  addCards(w.tw, document.getElementById("tw"), "tw");
  addCards(w.us, document.getElementById("us"), "us");

  // 台股／美股分頁：網址 #tw、#us 可直接指定（左側選單用），否則用上次看的分頁
  const tabBtns = document.querySelectorAll(".mk-tabs button");
  tabBtns.forEach((b) => { b.textContent += "（" + w[b.dataset.mk].length + "）"; });
  function showTab(mk) {
    tabBtns.forEach((b) => {
      const on = b.dataset.mk === mk;
      b.setAttribute("aria-pressed", String(on));
      b.setAttribute("aria-selected", String(on));
    });
    document.getElementById("pane-tw").hidden = mk !== "tw";
    document.getElementById("pane-us").hidden = mk !== "us";
    // 左側選單「我的追蹤 → 台股／美股」跟著標示目前分頁
    document.querySelectorAll(".sidebar a.sub").forEach((a) => {
      const h = a.getAttribute("href");
      if (/#(tw|us)$/.test(h)) a.classList.toggle("cur", h.endsWith("#" + mk));
    });
    try { localStorage.setItem("watch-tab", mk); } catch (e) {}
  }
  tabBtns.forEach((b) => b.addEventListener("click", () => { history.replaceState(null, "", "#" + b.dataset.mk); showTab(b.dataset.mk); }));
  window.addEventListener("hashchange", () => { if (/^#(tw|us)$/.test(location.hash)) showTab(location.hash.slice(1)); });
  // 顯示方式：小方塊／大方塊／清單（記在瀏覽器，兩個分頁一起套用）
  const viewBtns = document.querySelectorAll(".view-btns button");
  function setView(v) {
    ["tw", "us"].forEach((id) => {
      const g = document.getElementById(id);
      g.classList.remove("view-small", "view-large", "view-list");
      g.classList.add("view-" + v);
    });
    document.querySelector("main").classList.toggle("mode-list", v === "list");
    if (v === "list") { renderList("tw"); renderList("us"); }
    viewBtns.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === v)));
    try { localStorage.setItem("watch-view", v); } catch (e) {}
  }

  // ---------- 清單模式：欄位和全台股總表相同（assets/stockcols.js），多一欄近一年走勢 ----------
  const listState = { tw: { key: null, dir: 1, rows: null }, us: { key: null, dir: 1, rows: null } };
  async function listRows(m) {
    if (listState[m].rows) return listState[m].rows;
    if (m === "tw") {
      let all = null;
      try { all = await Refs.load(); } catch (e) {}
      const pegLv = all ? Refs.levelsFor(all.rows, "peg") : {};
      listState.tw.pegLv = pegLv;
      listState.tw.rows = w.tw.map((it) => {
        const s = Object.assign({ code: it.code, name: it.name, market: it.market }, all && all.byCode[it.code]);
        s.peg_any = App.isNum(s.peg) ? s.peg : s.peg_est;
        s._item = it;
        applyQuote(s, lastQ[it.code]);
        return s;
      });
    } else {
      let sum = null;
      try { sum = await App.loadJSON("data/summary.json"); } catch (e) {}
      const bySym = {};
      ((sum && sum.stocks) || []).filter((x) => x.market === "US").forEach((x) => { bySym[x.symbol] = StockCols.fromSummary(x); });
      listState.us.rows = w.us.map((it) => Object.assign({ code: it.ticker, name: it.name }, bySym[it.ticker.toUpperCase()], { _item: it }));
    }
    return listState[m].rows;
  }

  async function renderList(m) {
    const host = document.getElementById(m + "-list");
    const rows = await listRows(m);
    const base = m === "tw" ? StockCols.tw(listState.tw.pegLv || {}) : StockCols.us();
    // 走勢圖放在「漲跌」後面
    const at = base.findIndex((c) => c.k === "change_pct") + 1;
    const holdCols = Holdings.count(hold, m) ? holdingCols(m) : [];
    const cols = base.slice(0, at).concat([{ k: "_spark", t: "近一年走勢", nosort: true, f: (s) => '<span class="sp" data-sym="' + App.esc(s.code) + '"></span>' }], holdCols, base.slice(at));
    const st = listState[m];
    rows.forEach((s) => {
      setPx(m, s.code, s.close, true);
      const e = hold[m][s.code], c = Holdings.calc(e, s.close);
      Object.assign(s, { h_shares: e ? e.shares : null, h_avg: c.avg, h_mv: c.mv, h_pl: c.pl, h_pct: c.pct });
    });
    const oldWrap = host.querySelector(".table-wrap"), scrollX = oldWrap ? oldWrap.scrollLeft : 0;  // 即時更新重畫時保留左右捲動位置
    let list = rows.slice();
    if (st.key) {
      list.sort((a, b) => {
        const x = a[st.key], y = b[st.key];
        if (x == null && y == null) return 0;
        if (x == null) return 1;
        if (y == null) return -1;
        return (typeof x === "string" ? x.localeCompare(y, "zh-TW") : x - y) * st.dir;
      });
    }
    host.innerHTML =
      '<div class="table-wrap big-table watch-table"><table><thead><tr>' +
        cols.map((c, i) => '<th class="' + (c.nosort ? "" : "sort") + (c.l ? " l" : "") + (i < 2 ? " stick s" + i : "") + '"' +
          (c.nosort ? "" : ' data-k="' + c.k + '" tabindex="0"') + (st.key === c.k ? ' aria-sort="' + (st.dir > 0 ? "ascending" : "descending") + '"' : "") + ">" + c.t + "</th>").join("") +
        "<th></th></tr></thead><tbody>" +
        list.map((s) => '<tr class="link" data-sym="' + App.esc(s.code) + '">' +
          cols.map((c, i) => "<td" + (c.l || i < 2 ? ' class="' + (c.l ? "l" : "") + (i < 2 ? " stick s" + i : "") + '"' : "") + ">" + c.f(s) + "</td>").join("") +
          '<td><button type="button" class="rm-row" title="從追蹤清單移除" aria-label="從追蹤清單移除 ' + App.esc(s.name) + '">×</button></td></tr>').join("") +
      "</tbody></table></div>" +
      '<button type="button" class="list-add">＋ 加入' + (m === "tw" ? "台股" : "美股") + "</button>";
    if (scrollX) host.querySelector(".table-wrap").scrollLeft = scrollX;

    // 走勢圖：資料到了就畫上去
    list.forEach((s) => {
      stockData(s._item).then((d) => {
        const cell = host.querySelector('.sp[data-sym="' + CSS.escape(s.code) + '"]');
        if (cell) cell.innerHTML = StockCols.spark(d.price.close.slice(-250));
      }).catch(() => {});
    });
    host.querySelectorAll("th[data-k]").forEach((th) => {
      const go = () => {
        const c = cols.find((x) => x.k === th.dataset.k);
        st.dir = st.key === c.k ? -st.dir : (c.asc ? 1 : -1);
        st.key = c.k;
        renderList(m);
      };
      th.addEventListener("click", go);
      th.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
    });
    host.querySelector("tbody").addEventListener("click", (e) => {
      const tr = e.target.closest("tr[data-sym]");
      if (!tr) return;
      const s = list.find((x) => x.code === tr.dataset.sym);
      if (e.target.closest(".rm-row")) { removeStock(m, s._item, tr); return; }
      location.href = "stock.html?symbol=" + encodeURIComponent(s.code) + "&m=" + m;
    });
    host.querySelector(".list-add").addEventListener("click", () => openAdd(m));
  }
  viewBtns.forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
  let view = "large";
  try { view = localStorage.getItem("watch-view") || "large"; } catch (e) {}
  setView(["small", "large", "list"].includes(view) ? view : "large");

  let first = /^#(tw|us)$/.test(location.hash) ? location.hash.slice(1) : null;
  if (!first) { try { first = localStorage.getItem("watch-tab"); } catch (e) {} }
  showTab(first === "us" ? "us" : "tw");
  if (Holdings.count(hold, "tw") || Holdings.count(hold, "us")) loadHoldPrices();

  // ---------- 台股盤中即時（富果）：卡片、清單的股價、漲跌、成交量 ----------
  // 富果免費方案每分鐘 60 次、每檔算一次：間隔隨檔數拉長（約每分鐘用 30 次，留額度給個股頁）
  function applyQuote(s, q) {
    if (!s || !q || q.price == null) return;
    s.close = q.price; s.change_pct = q.pct; s.volume = q.vol;
  }
  if (w.tw.length) {
    const codes = w.tw.map((x) => x.code);
    Live.start(async () => {
      for (let i = 0; i < codes.length; i += 20) {
        const r = await Live.fetchRt(codes.slice(i, i + 20));
        Object.assign(lastQ, r.quotes);
      }
      for (const it of w.tw) {
        const q = lastQ[it.code];
        if (!q) continue;
        setPx("tw", it.code, q.price);
        const key = "tw:" + it.code;
        const d = dataCache[key] && await dataCache[key].catch(() => null);
        if (d) {
          d._base = d._base || d.price;
          d.price = Live.mergeDaily(d._base, q, 1000);  // 富果的量是張，日線是股
          d._live = q;
          if (twCards.has(it.code)) ownMini(twCards.get(it.code), it);
        }
        applyQuote(listState.tw.rows && listState.tw.rows.find((s) => s.code === it.code), q);
      }
      if (listState.tw.rows && document.querySelector("main").classList.contains("mode-list")) renderList("tw");
      return Object.values(lastQ).some((q) => q.date === Live.twNow().date);
    }, Math.max(10000, codes.length * 2000), (s) => { document.getElementById("tw-live").innerHTML = Live.badge(s); });
  }
})();
</script>
</body>
</html>
