<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>台美股看盤</title>
<script>try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar">
  <h1><a href="index.html">台美股看盤</a></h1>
  <nav><a href="index.html">追蹤清單</a><a href="compare.html">比較</a></nav>
</header>
<div class="tape" id="tape"></div>

<main class="wide">
  <div class="toolbar">
    <!-- 自選股分頁：頁簽雙擊或按 ✎ 改名稱，＋ 新增、− 刪除目前分頁（存在 config/groups.json） -->
    <div class="grp-bar">
      <div class="seg grp-tabs" role="tablist" aria-label="自選股分頁" id="grp-tabs"></div>
      <button type="button" class="btn grp-btn" id="grp-add" title="新增分頁" aria-label="新增分頁">＋</button>
      <button type="button" class="btn grp-btn" id="grp-del" title="刪除目前分頁" aria-label="刪除目前分頁">−</button>
      <button type="button" class="btn grp-btn" id="grp-ren" title="改目前分頁的名稱（也可以雙擊頁簽）" aria-label="改目前分頁的名稱">✎</button>
      <span class="updated" id="grp-msg" role="status"></span>
    </div>
    <span id="tw-live"></span>
    <button type="button" class="btn" id="io-import" title="匯入目前畫面的股票（庫存股：匯入庫存）">📥 匯入</button>
    <button type="button" class="btn" id="io-export" title="把目前畫面的股票存成 CSV（Excel 可開）">📤 匯出</button>
    <span class="view-title" id="view-title"></span>
    <div class="view-wrap">
    <span class="view-label" id="view-label">畫面顯示：</span>
    <div class="seg view-btns" role="group" aria-labelledby="view-label">
      <button type="button" data-view="small" title="小方塊" aria-label="小方塊">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="4" height="4"/><rect x="6" y="1" width="4" height="4"/><rect x="11" y="1" width="4" height="4"/><rect x="1" y="6" width="4" height="4"/><rect x="6" y="6" width="4" height="4"/><rect x="11" y="6" width="4" height="4"/><rect x="1" y="11" width="4" height="4"/><rect x="6" y="11" width="4" height="4"/><rect x="11" y="11" width="4" height="4"/></svg>
      </button>
      <button type="button" data-view="large" title="大方塊" aria-label="大方塊">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="6.5" height="6.5"/><rect x="8.5" y="1" width="6.5" height="6.5"/><rect x="1" y="8.5" width="6.5" height="6.5"/><rect x="8.5" y="8.5" width="6.5" height="6.5"/></svg>
      </button>
      <button type="button" data-view="list" title="清單" aria-label="清單">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="2" width="14" height="2.4"/><rect x="1" y="6.8" width="14" height="2.4"/><rect x="1" y="11.6" width="14" height="2.4"/></svg>
      </button>
    </div>
    </div>
  </div>
  <!-- 目前分頁：方塊模式看 .grid（台股美股混在一起），清單模式看 .list-pane（台股、美股各一張表，欄位與總表相同＋近一年走勢） -->
  <section id="pane" role="tabpanel">
    <div class="hold-sum" id="tw-hsum" hidden></div>
    <div class="hold-sum" id="us-hsum" hidden></div>
    <div class="grid" id="grid"></div>
    <div class="list-pane" id="tw-list"></div>
    <div class="list-pane" id="us-list"></div>
  </section>
</main>

<dialog id="add-dlg" aria-labelledby="add-title">
  <form method="dialog" class="dlg">
    <h3 id="add-title">加入追蹤</h3>
    <input type="search" id="add-q" placeholder="輸入代號或名稱，例：2454、聯發科、TSLA" autocomplete="off" aria-label="輸入代號或名稱">
    <ul id="add-list" class="pick-list"></ul>
    <p id="add-msg" class="updated" role="status"></p>
    <div class="dlg-foot"><button class="btn" value="cancel">關閉</button></div>
  </form>
</dialog>

<!-- 匯入股票清單（自選股分頁、台股、美股）：只要代號或名稱 -->
<dialog id="list-dlg" class="hold-dlg" aria-labelledby="list-title">
  <form method="dialog" class="dlg">
    <h3 id="list-title">匯入股票</h3>
    <div id="list-step1">
      <textarea id="list-text" rows="7" spellcheck="false" aria-label="貼上股票清單"
        placeholder="貼上股票代號或名稱，一行一檔，或從 Excel／XQ／YesWin 複製整個表格。&#10;2330&#10;聯發科&#10;AAPL&#10;也可以匯入這個網站「匯出」的 CSV。"></textarea>
      <div class="hold-row">
        <label class="btn">選擇檔案<input type="file" id="list-file" accept=".csv,.txt,.xls,.xlsx,.pdf" hidden></label>
        <span class="updated">CSV、Excel、TXT</span>
        <button type="button" class="btn primary" id="list-parse">解析</button>
      </div>
    </div>
    <div id="list-step2" hidden><div id="list-preview"></div></div>
    <p id="list-msg" class="updated" role="status"></p>
    <div class="dlg-foot hold-foot">
      <span></span>
      <button type="button" class="btn" id="list-back" hidden>重新貼上</button>
      <button class="btn" value="cancel">關閉</button>
      <button type="button" class="btn primary" id="list-save" hidden>加入</button>
    </div>
  </form>
</dialog>

<!-- 匯入庫存：持股只存在這台裝置的瀏覽器（assets/holdings.js） -->
<dialog id="hold-dlg" class="hold-dlg" aria-labelledby="hold-title">
  <form method="dialog" class="dlg">
    <h3 id="hold-title">匯入庫存</h3>
    <p class="updated">持股只存在這台裝置的瀏覽器，不會上傳到 GitHub。換電腦或手機要再匯入一次，可以用「備份」存成 CSV 帶過去。</p>
    <div id="hold-step1">
      <textarea id="hold-text" rows="7" spellcheck="false" aria-label="貼上庫存"
        placeholder="在 YesWin／XQ 的庫存表格全選複製，貼在這裡（含標題列）。&#10;也可以自己打，一行一檔：代號 股數 成本均價&#10;2330 1000 550.5&#10;0050 2000&#10;AAPL 10 180"></textarea>
      <div class="hold-row">
        <label class="btn">選擇檔案<input type="file" id="hold-file" accept=".csv,.txt,.xls,.xlsx,.pdf" hidden></label>
        <span class="updated">CSV、Excel、集保 e 手掌握 PDF</span>
        <button type="button" class="btn primary" id="hold-parse">解析</button>
      </div>
    </div>
    <div id="hold-step2" hidden>
      <div id="hold-preview"></div>
      <div class="hold-opts">
        <label><input type="radio" name="hold-mode" value="replace" checked> 取代目前持股</label>
        <label><input type="radio" name="hold-mode" value="merge"> 和目前持股相加</label>
        <label id="hold-addw-wrap"><input type="checkbox" id="hold-addw" checked> <span id="hold-addw-text"></span></label>
      </div>
    </div>
    <p id="hold-msg" class="updated" role="status"></p>
    <div class="dlg-foot hold-foot">
      <span class="hold-cur" id="hold-cur"></span>
      <button type="button" class="btn" id="hold-back" hidden>重新貼上</button>
      <button class="btn" value="cancel">關閉</button>
      <button type="button" class="btn primary" id="hold-save" hidden>匯入</button>
    </div>
  </form>
</dialog>

<footer>
  資料僅供參考，不構成投資建議。資料來源：TradingView、FinMind、公開資訊觀測站、SEC、Yahoo Finance。
</footer>

<script src="assets/app.js"></script>
<script src="assets/layout.js"></script>
<script src="assets/search.js"></script>
<script src="assets/widgets.js"></script>
<script src="assets/refs.js"></script>
<script src="assets/stockcols.js"></script>
<script src="assets/live.js"></script>
<script src="assets/holdings.js"></script>
<script>
(async function () {
  let w;
  try {
    w = await App.loadWatchlist();
  } catch (e) {
    document.querySelector("main").innerHTML = '<p class="msg">讀不到追蹤清單（config/watchlist.json）。</p>';
    return;
  }
  ownTape(document.getElementById("tape"));
  const twCards = new Map();  // 台股代號 → 卡片的走勢區（盤中即時更新用）
  const lastQ = {};           // 台股代號 → 最新的富果即時報價
  const hold = Holdings.load();   // 持股（只存在這台裝置）
  const px = { tw: {}, us: {} };  // 持股損益用的最新股價

  // ---------- 畫面：左側選單「台股」「美股」＝追蹤清單全部；右邊頁簽「庫存股」＋自選股分頁 ----------
  // view："tw" | "us" | "hold" | 數字（自選股分頁的位置）
  // 追蹤清單（watchlist.json）決定每天抓哪些股票的資料；自選股分頁（groups.json）只是分組，分頁裡的股票一定也在追蹤清單
  const itemOf = {};  // "tw:2330" → { m, item }
  function indexItems() {
    for (const k of Object.keys(itemOf)) delete itemOf[k];
    w.tw.forEach((it) => { itemOf["tw:" + it.code] = { m: "tw", item: it }; });
    w.us.forEach((it) => { itemOf["us:" + it.ticker.toUpperCase()] = { m: "us", item: it }; });
  }
  indexItems();
  const keyOf = (m, sym) => m + ":" + String(sym).toUpperCase();
  let groups = await App.loadGroups(w);
  groups.forEach((g) => { g.items = g.items.filter((k) => itemOf[k]); });

  let view = "hold";
  function viewFromHash() {
    const h = location.hash;
    if (h === "#tw" || h === "#us" || h === "#hold") return h.slice(1);
    const m = /^#g(\d+)$/.exec(h);
    if (m && +m[1] >= 1 && +m[1] <= groups.length) return +m[1] - 1;
    return null;
  }
  {
    let v = viewFromHash();
    if (v == null) { try { const s = localStorage.getItem("watch-view-key"); v = /^g\d+$/.test(s) ? +s.slice(1) : s; } catch (e) {} }
    view = v === "tw" || v === "us" || v === "hold" || (Number.isInteger(v) && v >= 0 && v < groups.length) ? v : "hold";
  }
  const isGroup = () => typeof view === "number";
  const holdKeys = () => Object.keys(hold.tw).sort().map((c) => "tw:" + c).concat(Object.keys(hold.us).sort().map((c) => "us:" + c.toUpperCase()));
  function viewKeys() {
    if (view === "tw") return w.tw.map((x) => "tw:" + x.code);
    if (view === "us") return w.us.map((x) => "us:" + x.ticker.toUpperCase());
    if (view === "hold") return holdKeys();
    return groups[view].items;
  }
  const viewSet = () => new Set(viewKeys());
  const viewName = () => (view === "tw" ? "全部台股" : view === "us" ? "全部美股" : view === "hold" ? "庫存股" : groups[view].name);
  // 卡片用的股票：追蹤清單的；庫存股裡不在追蹤清單的用持股資料補
  function entryOf(k) {
    if (itemOf[k]) return itemOf[k];
    const [m, sym] = k.split(":");
    const e = hold[m][sym] || hold[m][sym.toUpperCase()];
    if (!e) return null;
    return { m, item: m === "tw" ? { code: sym, name: e.name || sym, market: e.market || "TWSE" } : { ticker: sym, name: e.name || sym, exchange: e.exchange || "NASDAQ" }, outside: true };
  }

  // ---------- 自選股分頁存檔（依序存，快速連續改不會互相蓋掉） ----------
  const grpMsg = document.getElementById("grp-msg");
  let saving = Promise.resolve();
  function persist() {
    saving = saving.then(async () => {
      grpMsg.textContent = "儲存中…";
      try { await App.saveGroups(groups); grpMsg.textContent = "已儲存"; setTimeout(() => { if (grpMsg.textContent === "已儲存") grpMsg.textContent = ""; }, 2000); }
      catch (err) { grpMsg.textContent = "⚠ " + err.message; }
    });
    return saving;
  }

  // 頁簽：庫存股（固定）＋自選股分頁
  const tabsEl = document.getElementById("grp-tabs");
  function renderTabs() {
    const tab = (v, name, n, title) => '<button type="button" role="tab" data-v="' + v + '" aria-selected="' + (String(view) === String(v)) + '" aria-pressed="' + (String(view) === String(v)) + '"' + (title ? ' title="' + title + '"' : "") + ">" +
      '<span class="g-name">' + App.esc(name) + '</span><span class="g-cnt">' + n + "</span></button>";
    tabsEl.innerHTML = tab("hold", "庫存股", holdKeys().length, "匯入的持股（只存在這台裝置）") +
      groups.map((g, i) => tab(i, g.name, g.items.length, "雙擊可以改名稱")).join("");
    document.getElementById("grp-del").disabled = !isGroup() || groups.length <= 1;
    document.getElementById("grp-ren").disabled = !isGroup();
    document.getElementById("view-title").textContent = view === "tw" || view === "us" ? viewName() + " " + viewKeys().length + " 檔（追蹤清單）" : "";
  }
  const vOf = (b) => (b.dataset.v === "hold" ? "hold" : +b.dataset.v);
  tabsEl.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-v]");
    if (!b || b.querySelector("input") || vOf(b) === view) return;
    showView(vOf(b));
  });
  tabsEl.addEventListener("dblclick", (e) => {
    const b = e.target.closest("button[data-v]");
    if (b && b.dataset.v !== "hold") rename(+b.dataset.v);
  });
  // 改名稱：頁簽變成輸入框，Enter 或點別處存檔，Esc 取消
  function rename(i) {
    if (view !== i) showView(i);
    const b = tabsEl.querySelector('button[data-v="' + i + '"]');
    if (!b || b.querySelector("input")) return;
    const old = groups[i].name;
    b.innerHTML = '<input class="g-input" maxlength="16" aria-label="分頁名稱">';
    const inp = b.querySelector("input");
    inp.value = old;
    inp.focus();
    inp.select();
    let done = false;
    const finish = (save) => {
      if (done) return;
      done = true;
      const v = inp.value.replace(/[\u0000-\u001f"\\<>]/g, "").trim().slice(0, 16);
      if (save && v && v !== old) { groups[i].name = v; persist(); }
      renderTabs();
    };
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); finish(true); }
      else if (e.key === "Escape") { e.preventDefault(); finish(false); }
      e.stopPropagation();
    });
    inp.addEventListener("blur", () => finish(true));
    inp.addEventListener("click", (e) => e.stopPropagation());
  }
  document.getElementById("grp-ren").addEventListener("click", () => { if (isGroup()) rename(view); });
  document.getElementById("grp-add").addEventListener("click", () => {
    if (groups.length >= 30) { alert("最多 30 個自選股分頁。"); return; }
    const used = new Set(groups.map((g) => g.name));
    let n = groups.length + 1;
    while (used.has("自選" + n)) n++;
    groups.push({ name: "自選" + n, items: [] });
    showView(groups.length - 1);
    persist();
    rename(view);
  });
  document.getElementById("grp-del").addEventListener("click", () => {
    if (!isGroup() || groups.length <= 1) return;
    const g = groups[view];
    if (!confirm("刪除分頁「" + g.name + "」？" + (g.items.length ? "\n裡面的 " + g.items.length + " 檔仍會留在追蹤清單（左側「台股」「美股」看得到）。" : ""))) return;
    groups.splice(view, 1);
    showView(Math.max(0, view - 1));
    persist();
  });

  // ---------- 顯示目前畫面 ----------
  const grid = document.getElementById("grid");
  function showView(v) {
    view = v;
    try { localStorage.setItem("watch-view-key", isGroup() ? "g" + view : view); } catch (e) {}
    const hash = "#" + (isGroup() ? "g" + (view + 1) : view);
    if (location.hash !== hash) history.replaceState(null, "", hash);
    // 左側選單：台股／美股／自選股
    document.querySelectorAll(".sidebar a.sub").forEach((a) => {
      const h = a.getAttribute("href") || "";
      if (/^(index\.html)?#(tw|us|hold)$/.test(h)) a.classList.toggle("cur", h.endsWith("#" + (view === "tw" || view === "us" ? view : "hold")));
    });
    renderTabs();
    renderCards();
    if (document.querySelector("main").classList.contains("mode-list")) { renderList("tw"); renderList("us"); }
    renderHold();
    if (liveCtl) liveCtl.now();
  }
  window.addEventListener("hashchange", () => { const v = viewFromHash(); if (v != null && v !== view) showView(v); });

  function renderCards() {
    grid.innerHTML = "";
    twCards.clear();
    const rmTitle = view === "tw" || view === "us" ? "從追蹤清單移除" : view === "hold" ? "從庫存移除" : "從這個分頁移除";
    for (const k of viewKeys()) {
      const x = entryOf(k);
      if (!x) continue;
      const { m, item } = x, sym = App.symbolOf(item);
      const a = document.createElement("a");
      a.className = "card";
      a.href = "stock.html?symbol=" + encodeURIComponent(sym) + "&m=" + m;
      a.innerHTML = '<div class="card-head"><strong></strong><span></span></div>' +
        (hold[m][sym] ? '<div class="hold-line" data-k="' + m + ":" + App.esc(sym) + '"></div>' : "") + '<div class="mini"></div>' +
        '<button type="button" class="rm" title="' + rmTitle + '">×</button>';
      a.querySelector("strong").textContent = item.name;
      a.querySelector("span").textContent = (m === "us" && view !== "us" ? "美・" : "") + sym;
      a.querySelector(".rm").setAttribute("aria-label", rmTitle + " " + item.name);
      a.querySelector(".rm").addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); removeKey(k, a); });
      grid.appendChild(a);
      if (m === "tw") twCards.set(sym, a.querySelector(".mini"));
      ownMini(a.querySelector(".mini"), item);
    }
    // 最後一格「＋」：庫存股開匯入庫存，其他開搜尋
    const add = document.createElement("button");
    add.type = "button";
    add.className = "card add-card";
    add.innerHTML = '<span class="plus">＋</span><span>' + (view === "hold" ? "匯入庫存" : view === "tw" ? "加入台股" : view === "us" ? "加入美股" : "加入股票") + "</span>";
    add.addEventListener("click", addClick);
    grid.appendChild(add);
  }
  function addClick() { if (view === "hold") openHold(); else openAdd(); }

  // ---------- 加入股票（搜尋）：台股／美股畫面加進追蹤清單；自選股分頁加進分頁（新股票也加進追蹤清單） ----------
  const dlg = document.getElementById("add-dlg"), addQ = document.getElementById("add-q");
  const addList = document.getElementById("add-list"), addMsg = document.getElementById("add-msg");
  let picks = [], busy = false;
  function openAdd() {
    addQ.value = "";
    addList.innerHTML = "";
    document.getElementById("add-title").textContent = "加入股票到「" + viewName() + "」";
    addMsg.textContent = view === "tw" ? "台股上市、上櫃都可以加入。" : view === "us" ? "美股 Nasdaq、NYSE 都可以加入。" : "台股上市、上櫃，美股 Nasdaq、NYSE 都可以加入。";
    dlg.showModal();
    addQ.focus();
    App.loadStockList().catch(() => {});
  }
  let st;
  addQ.addEventListener("input", () => { clearTimeout(st); st = setTimeout(searchAdd, 120); });
  addQ.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); const p = picks.find((r) => !viewSet().has(keyOf(r.m, r.symbol))); if (p) addStock(p); } });
  async function searchAdd() {
    const q = addQ.value.trim();
    if (!q) { addList.innerHTML = ""; return; }
    let res = await App.searchStocks(q, 40);
    if (view === "tw" || view === "us") res = res.filter((r) => r.m === view);
    res = res.slice(0, 10);
    if (addQ.value.trim() !== q) return;
    picks = res;
    const here = viewSet();
    addList.innerHTML = res.length ? res.map((r, i) => {
      const k = keyOf(r.m, r.symbol), has = here.has(k);
      return '<li><button type="button" data-i="' + i + '"' + (has ? " disabled" : "") + "><b>" + App.esc(r.symbol) + "</b> " + App.esc(r.name) +
        ' <span>' + (r.m === "us" ? "美股・" : "") + App.esc(r.tag) + (has ? "・已在這裡" : itemOf[k] ? "・在追蹤清單" : "") + "</span></button></li>";
    }).join("") : '<li class="empty">找不到符合的股票</li>';
  }
  addList.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-i]");
    if (b && !b.disabled) addStock(picks[+b.dataset.i]);
  });
  async function addStock(r) {
    if (busy) return;
    busy = true;
    addMsg.textContent = "加入 " + r.symbol + " " + r.name + " 中…";
    try {
      const res = await addKeys([{ m: r.m, code: r.symbol, item: r.item }]);
      addMsg.textContent = "已加入 " + r.symbol + " " + r.name + "。" + (res.fresh ? "完整資料約 2～3 分鐘後產生，之後每天自動更新。" : "");
      if (res.fresh) setTimeout(() => location.reload(), 1200);
      else { busy = false; searchAdd(); }
    } catch (err) {
      addMsg.textContent = "⚠ " + err.message;
      busy = false;
    }
  }
  // 加進目前畫面：不在追蹤清單的先加進追蹤清單；自選股分頁再加進分頁。回傳 { fresh: 新加進追蹤清單的檔數 }
  async function addKeys(list) {
    const fresh = list.filter((x) => !itemOf[keyOf(x.m, x.code)]);
    for (const m of ["tw", "us"]) {
      const items = fresh.filter((x) => x.m === m).map((x) => x.item);
      if (items.length) { w = await App.editWatchlist("add", m, items); w = { tw: w.tw || [], us: w.us || [] }; }
    }
    if (fresh.length) { indexItems(); listState.tw.rows = listState.us.rows = null; }
    if (isGroup()) {
      const g = groups[view], have = new Set(g.items);
      list.forEach((x) => { const k = keyOf(x.m, x.code); if (!have.has(k)) { have.add(k); g.items.push(k); } });
      await persist();
    }
    if (!fresh.length) showView(view);
    return { fresh: fresh.length };
  }

  // ×：台股／美股畫面＝從追蹤清單移除（也從各分頁拿掉）；庫存股＝刪掉這台裝置的持股資料；自選股分頁＝只從分頁移除
  async function removeKey(k, el) {
    const x = entryOf(k), label = x.item.name + "（" + App.symbolOf(x.item) + "）";
    if (view === "hold") {
      if (!confirm("從庫存移除「" + label + "」？（只刪這台裝置的持股資料，追蹤清單不變）")) return;
      delete hold[x.m][App.symbolOf(x.item)];
      try { Holdings.save(hold); } catch (err) {}
      showView(view);
      return;
    }
    if (isGroup()) {
      if (!confirm("從「" + groups[view].name + "」移除「" + label + "」？（仍留在追蹤清單）")) return;
      groups[view].items = groups[view].items.filter((y) => y !== k);
      showView(view);
      persist();
      return;
    }
    const inGroups = groups.filter((g) => g.items.includes(k)).map((g) => g.name);
    if (!confirm("從追蹤清單移除「" + label + "」？不再每天抓它的資料。" + (inGroups.length ? "\n也會從自選股分頁移除：" + inGroups.join("、") : ""))) return;
    el.classList.add("busy");
    try {
      w = await App.editWatchlist("remove", x.m, x.item);
      w = { tw: w.tw || [], us: w.us || [] };
    } catch (err) { el.classList.remove("busy"); alert(err.message); return; }
    indexItems();
    listState.tw.rows = listState.us.rows = null;
    if (inGroups.length) { groups.forEach((g) => { g.items = g.items.filter((y) => y !== k); }); persist(); }
    showView(view);
  }

  // ---------- 匯出／匯入（每個畫面都可以） ----------
  function download(name, text) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["\ufeff" + text], { type: "text/csv" }));  // 加 BOM：Excel 開中文不會亂碼
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }
  const today = () => new Date().toLocaleDateString("sv-SE");  // 本地日期 YYYY-MM-DD
  document.getElementById("io-export").addEventListener("click", () => {
    if (view === "hold") { download("庫存股_" + today() + ".csv", Holdings.toCsv(hold)); return; }
    const q = (s) => '"' + String(s == null ? "" : s).replace(/"/g, '""') + '"';
    const lines = ["市場,代號,名稱"].concat(viewKeys().map((k) => { const x = entryOf(k); return x ? [x.m === "tw" ? "台股" : "美股", App.symbolOf(x.item), q(x.item.name)].join(",") : null; }).filter(Boolean));
    download(viewName().replace(/[\\/:*?"<>|]/g, "_") + "_" + today() + ".csv", lines.join("\n") + "\n");
  });
  document.getElementById("io-import").addEventListener("click", () => { if (view === "hold") openHold(); else openList(); });

  // 股票清單匯入（自選股分頁、台股、美股）：貼上或選檔 → 預覽勾選 → 加入
  const ld = {
    dlg: document.getElementById("list-dlg"), text: document.getElementById("list-text"), file: document.getElementById("list-file"),
    step1: document.getElementById("list-step1"), step2: document.getElementById("list-step2"), preview: document.getElementById("list-preview"),
    msg: document.getElementById("list-msg"), save: document.getElementById("list-save"), back: document.getElementById("list-back"),
  };
  let lparsed = null, listBusy = false;
  function listStep(n) { ld.step1.hidden = n !== 1; ld.step2.hidden = n !== 2; ld.save.hidden = n !== 2; ld.back.hidden = n !== 2; }
  function openList() {
    document.getElementById("list-title").textContent = "匯入股票到「" + viewName() + "」";
    listStep(1); ld.msg.textContent = ""; ld.file.value = "";
    ld.dlg.showModal();
    App.loadStockList().catch(() => {});
  }
  async function runListParse(getRows) {
    ld.msg.textContent = "解析中…";
    try {
      const [rows, list] = await Promise.all([getRows(), App.loadStockList()]);
      lparsed = Holdings.parseList(rows, list);
    } catch (err) { ld.msg.textContent = "⚠ " + err.message; return; }
    if (view === "tw" || view === "us") lparsed.items = lparsed.items.filter((it) => it.m === view);
    if (!lparsed.items.length) { ld.msg.textContent = "⚠ 找不到" + (view === "us" ? "美股" : view === "tw" ? "台股" : "股票") + "代號或名稱。"; return; }
    const here = viewSet();
    ld.preview.innerHTML = '<div class="table-wrap hold-table"><table><thead><tr><th></th><th class="l">代號</th><th class="l">名稱</th><th class="l">狀態</th></tr></thead><tbody>' +
      lparsed.items.map((it, i) => {
        const k = keyOf(it.m, it.code), has = here.has(k);
        return '<tr data-i="' + i + '"><td><input type="checkbox"' + (has ? " disabled" : " checked") + ' aria-label="加入 ' + App.esc(it.name) + '"></td>' +
          '<td class="l">' + App.esc(it.code) + (it.m === "us" ? ' <span class="tag-us">美</span>' : "") + '</td><td class="l">' + App.esc(it.name) + "</td>" +
          '<td class="l updated">' + (has ? "已在這裡" : itemOf[k] ? "在追蹤清單" : "新股票") + "</td></tr>";
      }).join("") + "</tbody></table></div>" +
      (lparsed.skipped.length ? '<details class="updated"><summary>略過 ' + lparsed.skipped.length + " 列</summary>" +
        lparsed.skipped.map((x) => "<div>" + App.esc(x.text.slice(0, 60)) + "（" + x.why + "）</div>").join("") + "</details>" : "");
    ld.preview.onchange = updateListSave;

  const listChosen = () => [...ld.preview.querySelectorAll("tr[data-i]")].filter((tr) => tr.querySelector("input").checked).map((tr) => lparsed.items[+tr.dataset.i]);
  function updateListSave() { ld.save.textContent = "加入 " + listChosen().length + " 檔"; }
  document.getElementById("list-parse").addEventListener("click", () => {
    if (!ld.text.value.trim()) { ld.msg.textContent = "請先貼上股票清單，或選擇檔案。"; return; }
    runListParse(async () => Holdings.textRows(ld.text.value));
  });
  ld.file.addEventListener("change", () => { if (ld.file.files[0]) runListParse(() => Holdings.fileRows(ld.file.files[0])); });
  ld.back.addEventListener("click", () => { listStep(1); ld.msg.textContent = ""; ld.file.value = ""; });
  ld.save.addEventListener("click", async () => {
    if (listBusy) return;
    const items = listChosen();
    if (!items.length) { ld.msg.textContent = "請至少勾選一檔。"; return; }
    listBusy = true;
    ld.msg.textContent = "加入中…";
    try {
      const res = await addKeys(items.map((it) => ({ m: it.m, code: it.code, item: it.m === "tw" ? { code: it.code, name: it.name, market: it.market } : { ticker: it.code, name: it.name, exchange: it.exchange } })));
      ld.msg.textContent = "已加入 " + items.length + " 檔" + (res.fresh ? "（其中 " + res.fresh + " 檔是新股票，完整資料約 2～3 分鐘後產生）" : "") + "。";
      if (res.fresh) setTimeout(() => location.reload(), 1500);
      else setTimeout(() => ld.dlg.close(), 800);
    } catch (err) { ld.msg.textContent = "⚠ " + err.message; }
    listBusy = false;
  });

  // 頁首報價列：讀 summary.json（紅漲綠跌）；讀不到就退回 TradingView 跑馬燈
  async function ownTape(host) {
    let s;
    try { s = await App.loadJSON("data/summary.json"); } catch (e) { return TV.tickerTape(host, [...w.tw, ...w.us]); }
    const one = s.stocks.map((x) =>
      '<a href="stock.html?symbol=' + encodeURIComponent(x.symbol) + '"><b>' + App.esc(x.name) + "</b> " +
      (x.market === "US" ? "$" : "") + App.fmtPrice(x.price) +
      ' <span class="' + App.upDown(x.change_pct) + '">' + App.fmtPct(x.change_pct, true) + "</span></a>").join("");
    // 股票少時重複幾次，讓半條就比螢幕寬（約 16 檔以上），循環時右邊才不會出現空白
    const reps = Math.max(1, Math.ceil(16 / Math.max(1, s.stocks.length)));
    const half = one.repeat(reps);
    // 內容放兩份、整條往左移一半，接起來就是無縫循環；每檔約 4 秒，速度固定
    host.innerHTML = '<div class="own-tape"><div class="track" style="animation-duration:' + (s.stocks.length * reps * 4) + 's">' +
      '<span class="dup">' + half + '</span><span aria-hidden="true" class="dup">' + half + "</span></div></div>";
    host.querySelectorAll('[aria-hidden="true"] a').forEach((a) => a.tabIndex = -1);
  }

  // 卡片：用自己的日 K 資料畫近一年走勢（紅漲綠跌）
  // 剛加入、排程還沒產生資料檔的股票先即時查詢；都失敗才退回 TradingView
  // 每檔的日 K 資料只抓一次（方塊卡片和清單走勢圖共用）
  const dataCache = {};
  function stockData(item) {
    const key = App.marketOf(item) + ":" + App.symbolOf(item);
    if (!dataCache[key]) {
      dataCache[key] = App.loadStockData(item).catch(() => App.loadLiveData(item)).catch((e) => { delete dataCache[key]; throw e; });
    }
    return dataCache[key];
  }

  async function ownMini(host, item) {
    let d;
    try { d = await stockData(item); } catch (e) { return TV.miniOverview(host, item); }
    const c = d.price.close.slice(-250), dates = d.price.dates.slice(-250), n = c.length;
    if (n < 2) return TV.miniOverview(host, item);
    setPx(App.marketOf(item), App.symbolOf(item), c[n - 1]);
    const diff = c[n - 1] - c[n - 2], pct = diff / c[n - 2] * 100;
    const yearCls = App.upDown(c[n - 1] - c[0]);
    const min = Math.min(...c), max = Math.max(...c), W = 300, H = 100;
    const pts = c.map((x, i) => (i / (n - 1) * W).toFixed(1) + "," + (H - (x - min) / (max - min || 1) * H).toFixed(1)).join(" ");
    host.innerHTML =
      '<div class="own-mini">' +
        '<div><span class="px ' + App.upDown(diff) + '">' + (d.market === "US" ? "$" : "") + App.fmtPrice(c[n - 1]) + '</span>' +
        '<span class="chg ' + App.upDown(diff) + '">' + App.fmtPct(pct, true) + '</span></div>' +
        '<div class="sub">' + (d._live ? (d._live.closed ? "收盤 " : "盤中 ") + App.esc(d._live.date) : "收盤 " + App.esc(dates[n - 1])) + "・近一年 " + App.fmtPct((c[n - 1] / c[0] - 1) * 100, true) + "</div>" +
        '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" aria-hidden="true">' +
          '<polyline points="' + pts + '" fill="none" stroke="var(--' + (yearCls || "muted") + ')" stroke-width="1.6" vector-effect="non-scaling-stroke"/>' +
        "</svg>" +
      "</div>";
  }

  // ---------- 持股：股數、成本、損益（只存在這台裝置的瀏覽器） ----------
  // 價格來源：盤中即時 > 個股日 K 最後一筆 > 全台股總表／summary.json（不在追蹤清單的持股也用得到）
  function setPx(m, code, p, weak) {
    if (!App.isNum(p) || (weak && App.isNum(px[m][code]))) return;
    if (px[m][code] === p) return;
    px[m][code] = p;
    clearTimeout(holdTimer);
    holdTimer = setTimeout(renderHold, 50);
  }
  let holdTimer;
  async function loadHoldPrices() {
    if (Holdings.count(hold, "tw")) {
      try { const all = await Refs.load(); for (const code of Object.keys(hold.tw)) setPx("tw", code, all.byCode[code] && all.byCode[code].close, true); } catch (e) {}
    }
    if (Holdings.count(hold, "us")) {
      try {
        const sum = await App.loadJSON("data/summary.json");
        for (const x of sum.stocks || []) if (x.market === "US" && hold.us[x.symbol]) setPx("us", x.symbol, x.price, true);
      } catch (e) {}
    }
    renderHold();
  }
  const money = (m, n, signed) => (App.isNum(n) ? (signed && n > 0 ? "+" : n < 0 ? "−" : "") + (m === "us" ? "$" : "") + App.fmtNum(Math.abs(n), m === "us" ? 2 : 0) : "—");
  const shareFmt = (n) => (App.isNum(n) ? n.toLocaleString("zh-TW", { maximumFractionDigits: 4 }) : "—");
  function plHtml(m, c) {
    if (!App.isNum(c.pl)) return '<span class="updated">損益 —</span>';
    return '<span class="' + App.upDown(c.pl) + '">損益 ' + money(m, c.pl, true) + "（" + App.fmtPct(c.pct, true) + "）</span>";
  }
  function holdingCols(m) {
    return [
      { k: "h_shares", t: "持股(股)", f: (s) => shareFmt(s.h_shares) },
      { k: "h_avg", t: "成本均價", asc: true, f: (s) => (App.isNum(s.h_avg) ? (m === "us" ? "$" : "") + App.fmtNum(s.h_avg, 2) : "—") },
      { k: "h_mv", t: "持股市值", f: (s) => money(m, s.h_mv) },
      { k: "h_pl", t: "未實現損益", f: (s) => '<span class="' + App.upDown(s.h_pl) + '">' + money(m, s.h_pl, true) + "</span>" },
      { k: "h_pct", t: "報酬率", f: (s) => StockCols.pctCell(s.h_pct) },
    ];
  }
  function renderHold() {
    // 卡片上的持股列
    document.querySelectorAll(".hold-line").forEach((el) => {
      const [m, code] = el.dataset.k.split(":");
      const e = hold[m][code];
      if (!e) return;
      const c = Holdings.calc(e, px[m][code]);
      el.innerHTML = "<span>持有 " + shareFmt(e.shares) + " 股" + (App.isNum(c.avg) ? "・均 " + App.fmtNum(c.avg, 2) : "") + "</span> " + plHtml(m, c);
    });
    // 目前畫面裡的持股總計（台股、美股分開：幣別不同）
    const here = viewSet();
    for (const m of ["tw", "us"]) {
      const el = document.getElementById(m + "-hsum");
      const codes = Object.keys(hold[m]).filter((c) => here.has(keyOf(m, c)));
      el.hidden = !codes.length;
      if (!codes.length) continue;
      let mv = 0, cost = 0, mvC = 0, noPx = 0, noCost = 0;
      for (const code of codes) {
        const e = hold[m][code], p = px[m][code];
        if (!App.isNum(p)) { noPx++; continue; }
        mv += p * e.shares;
        if (App.isNum(e.cost) && e.cost > 0) { cost += e.cost; mvC += p * e.shares; } else noCost++;
      }
      const pl = cost ? mvC - cost : null;
      const notes = [];
      const outside = codes.filter((c) => !itemOf[keyOf(m, c)]).length;
      if (outside) notes.push(outside + " 檔不在追蹤清單（不會每天抓資料）");
      if (noPx) notes.push(noPx + " 檔沒有股價，未計入");
      if (noCost) notes.push(noCost + " 檔沒有成本，損益未計入");
      notes.push("損益未扣賣出手續費與稅");
      el.innerHTML =
        "<div><span>" + (m === "tw" ? "台股" : "美股") + "持股 <b>" + codes.length + "</b> 檔</span>" +
        "<span>市值 <b>" + money(m, mv) + "</b></span>" +
        "<span>成本 <b>" + (cost ? money(m, cost) : "—") + "</b></span>" +
        '<span>未實現損益 <b class="' + App.upDown(pl) + '">' + (pl == null ? "—" : money(m, pl, true) + "（" + App.fmtPct(pl / cost * 100, true) + "）") + "</b></span></div>" +
        '<div class="updated">' + notes.join("・") + "</div>";
    }
  }

  // 匯入庫存對話框
  const hd = {
    dlg: document.getElementById("hold-dlg"), text: document.getElementById("hold-text"), file: document.getElementById("hold-file"),
    step1: document.getElementById("hold-step1"), step2: document.getElementById("hold-step2"), preview: document.getElementById("hold-preview"),
    msg: document.getElementById("hold-msg"), save: document.getElementById("hold-save"), back: document.getElementById("hold-back"),
    cur: document.getElementById("hold-cur"), addw: document.getElementById("hold-addw"), addwWrap: document.getElementById("hold-addw-wrap"),
    addwText: document.getElementById("hold-addw-text"),
  };
  let parsed = null, holdBusy = false;
  function holdStep(n) {
    hd.step1.hidden = n !== 1; hd.step2.hidden = n !== 2;
    hd.save.hidden = n !== 2; hd.back.hidden = n !== 2;
  }
  function holdCur() {
    const t = Holdings.count(hold, "tw"), u = Holdings.count(hold, "us");
    hd.cur.innerHTML = t + u ? "目前持股：台股 " + t + "、美股 " + u + ' 檔 <button type="button" class="linkish" data-act="backup">備份</button> <button type="button" class="linkish" data-act="clear">清除</button>' : "目前沒有持股資料";
  }
  function openHold() {
    holdStep(1); hd.msg.textContent = ""; hd.file.value = ""; holdCur();
    hd.dlg.showModal();
    App.loadStockList().catch(() => {});
  }
  hd.cur.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-act]");
    if (!b) return;
    if (b.dataset.act === "backup") download("庫存股_" + today() + ".csv", Holdings.toCsv(hold));
    else if (confirm("清除這台裝置上的全部持股資料？（追蹤清單不受影響）")) {
      hold.tw = {}; hold.us = {};
      try { Holdings.save(hold); } catch (err) {}
      location.reload();
    }
  });
  async function runParse(getRows) {
    hd.msg.textContent = "解析中…";
    try {
      const [rows, list] = await Promise.all([getRows(), App.loadStockList()]);
      parsed = Holdings.parseRows(rows, list);
    } catch (err) { hd.msg.textContent = "⚠ " + err.message; return; }
    if (!parsed.items.length) {
      hd.msg.textContent = "⚠ 找不到持股。" + (parsed.skipped.length ? "略過：" + parsed.skipped.slice(0, 3).map((x) => x.text.slice(0, 30) + "（" + x.why + "）").join("；") : "") + " 請確認有代號或名稱、股數兩欄。";
      return;
    }
    hd.msg.textContent = "";
    showPreview();
  }
  document.getElementById("hold-parse").addEventListener("click", () => {
    if (!hd.text.value.trim()) { hd.msg.textContent = "請先貼上庫存，或選擇檔案。"; return; }
    runParse(async () => Holdings.textRows(hd.text.value));
  });
  hd.file.addEventListener("change", () => { if (hd.file.files[0]) runParse(() => Holdings.fileRows(hd.file.files[0])); });
  hd.back.addEventListener("click", () => { holdStep(1); hd.msg.textContent = ""; hd.file.value = ""; });

  function showPreview() {
    hd.preview.innerHTML =
      '<div class="table-wrap hold-table"><table><thead><tr><th></th><th class="l">代號</th><th class="l">名稱</th><th>股數</th><th>成本均價</th><th>總成本</th></tr></thead><tbody>' +
      parsed.items.map((it, i) =>
        '<tr data-i="' + i + '"><td><input type="checkbox" checked aria-label="匯入 ' + App.esc(it.name) + '"></td>' +
        '<td class="l">' + App.esc(it.code) + (it.m === "us" ? ' <span class="tag-us">美</span>' : "") + "</td>" +
        '<td class="l">' + App.esc(it.name) + (itemOf[keyOf(it.m, it.code)] ? "" : ' <span class="updated">新</span>') + "</td>" +
        '<td><input type="number" class="h-sh" min="0" step="any" value="' + it.shares + '" aria-label="股數"></td>' +
        '<td><input type="number" class="h-avg" min="0" step="any" value="' + (it.cost != null ? +(it.cost / it.shares).toFixed(4) : "") + '" placeholder="不填" aria-label="成本均價"></td>' +
        '<td class="h-cost">' + (it.cost != null ? money(it.m, it.cost) : "—") + "</td></tr>").join("") +
      "</tbody></table></div>" +
      (parsed.skipped.length ? '<details class="updated"><summary>略過 ' + parsed.skipped.length + " 列</summary>" +
        parsed.skipped.map((x) => "<div>" + App.esc(x.text.slice(0, 60)) + "（" + x.why + "）</div>").join("") + "</details>" : "");
    hd.preview.oninput = (e) => {
      const tr = e.target.closest("tr[data-i]");
      if (!tr) return;
      const it = parsed.items[+tr.dataset.i];
      const sh = parseFloat(tr.querySelector(".h-sh").value), avg = parseFloat(tr.querySelector(".h-avg").value);
      if (e.target.classList.contains("h-sh")) {
        const oldAvg = it.cost != null ? it.cost / it.shares : null;
        if (sh > 0) { it.shares = sh; if (oldAvg != null) it.cost = oldAvg * sh; }
      } else if (e.target.classList.contains("h-avg")) {
        it.cost = avg > 0 ? avg * it.shares : null;
      }
      tr.querySelector(".h-cost").textContent = it.cost != null ? money(it.m, it.cost) : "—";
      updateAddw();
    };
    hd.preview.onchange = updateAddw;
    updateAddw();
    holdStep(2);
  }
  function chosen() {
    return [...hd.preview.querySelectorAll("tr[data-i]")].filter((tr) => tr.querySelector("input[type=checkbox]").checked).map((tr) => parsed.items[+tr.dataset.i]);
  }
  // 不在追蹤清單的持股（可以一起加進追蹤清單，每天抓資料）
  function newOnes() { return chosen().filter((it) => !itemOf[keyOf(it.m, it.code)]); }
  function updateAddw() {
    const n = newOnes().length;
    hd.addwWrap.hidden = !n;
    hd.addwText.textContent = "不在追蹤清單的 " + n + " 檔一起加入追蹤清單（每天抓資料）";
    hd.save.textContent = "匯入 " + chosen().length + " 檔";
  }
  hd.save.addEventListener("click", async () => {
    if (holdBusy) return;
    const items = chosen();
    if (!items.length) { hd.msg.textContent = "請至少勾選一檔。"; return; }
    const mode = hd.dlg.querySelector('input[name="hold-mode"]:checked').value;
    const next = { tw: mode === "replace" ? {} : Object.assign({}, hold.tw), us: mode === "replace" ? {} : Object.assign({}, hold.us) };
    for (const it of items) {
      const prev = next[it.m][it.code];
      const e = { name: it.name, shares: it.shares, cost: it.cost };
      if (it.m === "tw") e.market = it.market; else e.exchange = it.exchange;
      if (prev) { e.shares += prev.shares; e.cost = prev.cost != null && it.cost != null ? prev.cost + it.cost : null; }
      next[it.m][it.code] = e;
    }
    try { Holdings.save(next); } catch (err) { hd.msg.textContent = "⚠ 瀏覽器不能儲存（可能是無痕模式）：" + err.message; return; }
    try { localStorage.setItem("watch-view-key", "hold"); } catch (err) {}
    const add = hd.addw.checked ? newOnes() : [];
    if (!add.length) { hd.msg.textContent = "已匯入 " + items.length + " 檔。"; setTimeout(() => { location.hash = "#hold"; location.reload(); }, 600); return; }
    holdBusy = true;
    hd.msg.textContent = "持股已存好。加入追蹤清單中…";
    try {
      for (const m of ["tw", "us"]) {
        const list = add.filter((it) => it.m === m).map((it) => (m === "tw" ? { code: it.code, name: it.name, market: it.market } : { ticker: it.code, name: it.name, exchange: it.exchange }));
        if (list.length) await App.editWatchlist("add", m, list);
      }
      hd.msg.textContent = "已匯入 " + items.length + " 檔，新增 " + add.length + " 檔到追蹤清單（完整資料約 2～3 分鐘後產生）。";
      setTimeout(() => { location.hash = "#hold"; location.reload(); }, 1500);
    } catch (err) {
      hd.msg.textContent = "持股已存好，但加入追蹤清單失敗：" + err.message;
      holdBusy = false;
    }
  });

  // 顯示方式：小方塊／大方塊／清單（記在瀏覽器）
  const viewBtns = document.querySelectorAll(".view-btns button");
  function setLayout(v) {
    grid.classList.remove("view-small", "view-large", "view-list");
    grid.classList.add("view-" + v);
    document.querySelector("main").classList.toggle("mode-list", v === "list");
    if (v === "list") { renderList("tw"); renderList("us"); }
    viewBtns.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === v)));
    try { localStorage.setItem("watch-view", v); } catch (e) {}
  }

  // ---------- 清單模式：欄位和全台股總表相同（assets/stockcols.js），多一欄近一年走勢；台股、美股各一張表 ----------
  const listState = { tw: { key: null, dir: 1, rows: null }, us: { key: null, dir: 1, rows: null } };
  const listSrc = { tw: null, us: null };  // 全台股總表、summary.json（庫存股裡不在追蹤清單的也查得到）
  async function listRows(m) {
    if (listState[m].rows) return listState[m].rows;
    if (m === "tw") {
      if (!listSrc.tw) { try { listSrc.tw = await Refs.load(); } catch (e) { listSrc.tw = { rows: [], byCode: {} }; } }
      listState.tw.pegLv = Refs.levelsFor(listSrc.tw.rows, "peg");
      listState.tw.rows = w.tw.map((it) => twRow(it));
    } else {
      await usSrc();
      listState.us.rows = w.us.map((it) => usRow(it));
    }
    return listState[m].rows;
  }
  function twRow(it) {
    const s = Object.assign({ code: it.code, name: it.name, market: it.market }, listSrc.tw && listSrc.tw.byCode[it.code]);
    s.peg_any = App.isNum(s.peg) ? s.peg : s.peg_est;
    s._item = it;
    applyQuote(s, lastQ[it.code]);
    return s;
  }
  async function usSrc() {
    if (listSrc.us) return;
    let sum = null;
    try { sum = await App.loadJSON("data/summary.json"); } catch (e) {}
    listSrc.us = {};
    ((sum && sum.stocks) || []).filter((x) => x.market === "US").forEach((x) => { listSrc.us[x.symbol] = StockCols.fromSummary(x); });
  }
  function usRow(it) { return Object.assign({ code: it.ticker, name: it.name }, listSrc.us[it.ticker.toUpperCase()], { _item: it }); }

  async function renderList(m) {
    const host = document.getElementById(m + "-list");
    const keys = viewKeys().filter((k) => k.startsWith(m + ":"));
    const all = await listRows(m);
    const byCode = new Map(all.map((s) => [keyOf(m, s.code), s]));
    // 庫存股裡不在追蹤清單的：用總表資料補一列
    const rows = keys.map((k) => byCode.get(k) || (entryOf(k) && (m === "tw" ? twRow(entryOf(k).item) : usRow(entryOf(k).item)))).filter(Boolean);
    const onlyMarket = !viewKeys().some((k) => !k.startsWith(m + ":"));
    host.hidden = !rows.length && !(m === "tw" && !viewKeys().length) && !(view === m);
    if (host.hidden) return;
    const base = m === "tw" ? StockCols.tw(listState.tw.pegLv || {}) : StockCols.us();
    // 走勢圖放在「漲跌」後面
    const at = base.findIndex((c) => c.k === "change_pct") + 1;
    const holdCols = Holdings.count(hold, m) ? holdingCols(m) : [];
    const cols = base.slice(0, at).concat([{ k: "_spark", t: "近一年走勢", nosort: true, f: (s) => '<span class="sp" data-sym="' + App.esc(s.code) + '"></span>' }], holdCols, base.slice(at));
    const st = listState[m];
    rows.forEach((s) => {
      setPx(m, s.code, s.close, true);
      const e = hold[m][s.code], c = Holdings.calc(e, s.close);
      Object.assign(s, { h_shares: e ? e.shares : null, h_avg: c.avg, h_mv: c.mv, h_pl: c.pl, h_pct: c.pct });
    });
    const oldWrap = host.querySelector(".table-wrap"), scrollX = oldWrap ? oldWrap.scrollLeft : 0;  // 即時更新重畫時保留左右捲動位置
    let list = rows.slice();
    if (st.key) {
      list.sort((a, b) => {
        const x = a[st.key], y = b[st.key];
        if (x == null && y == null) return 0;
        if (x == null) return 1;
        if (y == null) return -1;
        return (typeof x === "string" ? x.localeCompare(y, "zh-TW") : x - y) * st.dir;
      });
    }
    const rmTitle = view === "tw" || view === "us" ? "從追蹤清單移除" : view === "hold" ? "從庫存移除" : "從這個分頁移除";
    host.innerHTML =
      (!onlyMarket ? '<div class="list-cap">' + (m === "tw" ? "台股" : "美股") + " " + list.length + " 檔</div>" : "") +
      '<div class="table-wrap big-table watch-table"><table><thead><tr>' +
        cols.map((c, i) => '<th class="' + (c.nosort ? "" : "sort") + (c.l ? " l" : "") + (i < 2 ? " stick s" + i : "") + '"' +
          (c.nosort ? "" : ' data-k="' + c.k + '" tabindex="0"') + (st.key === c.k ? ' aria-sort="' + (st.dir > 0 ? "ascending" : "descending") + '"' : "") + ">" + c.t + "</th>").join("") +
        "<th></th></tr></thead><tbody>" +
        list.map((s) => '<tr class="link" data-sym="' + App.esc(s.code) + '">' +
          cols.map((c, i) => "<td" + (c.l || i < 2 ? ' class="' + (c.l ? "l" : "") + (i < 2 ? " stick s" + i : "") + '"' : "") + ">" + c.f(s) + "</td>").join("") +
          '<td><button type="button" class="rm-row" title="' + rmTitle + '" aria-label="' + rmTitle + " " + App.esc(s.name) + '">×</button></td></tr>').join("") +
      "</tbody></table></div>" +
      ((m === "us" || !viewKeys().some((k) => k.startsWith("us:"))) ? '<button type="button" class="list-add">＋ ' + (view === "hold" ? "匯入庫存" : "加入股票") + "</button>" : "");
    if (scrollX) host.querySelector(".table-wrap").scrollLeft = scrollX;

    // 走勢圖：資料到了就畫上去
    list.forEach((s) => {
      stockData(s._item).then((d) => {
        const cell = host.querySelector('.sp[data-sym="' + CSS.escape(s.code) + '"]');
        if (cell) cell.innerHTML = StockCols.spark(d.price.close.slice(-250));
      }).catch(() => {});
    });
    host.querySelectorAll("th[data-k]").forEach((th) => {
      const go = () => {
        const c = cols.find((x) => x.k === th.dataset.k);
        st.dir = st.key === c.k ? -st.dir : (c.asc ? 1 : -1);
        st.key = c.k;
        renderList(m);
      };
      th.addEventListener("click", go);
      th.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
    });
    host.querySelector("tbody").addEventListener("click", (e) => {
      const tr = e.target.closest("tr[data-sym]");
      if (!tr) return;
      const s = list.find((x) => x.code === tr.dataset.sym);
      if (e.target.closest(".rm-row")) { removeKey(keyOf(m, s.code), tr); return; }
      location.href = "stock.html?symbol=" + encodeURIComponent(s.code) + "&m=" + m;
    });
    const la = host.querySelector(".list-add");
    if (la) la.addEventListener("click", addClick);
  }

  // ---------- 台股盤中即時（富果）：目前畫面的台股卡片、清單的股價、漲跌、成交量 ----------
  // 富果免費方案每分鐘 60 次、每檔算一次：間隔隨檔數拉長（約每分鐘用 30 次，留額度給個股頁）
  function applyQuote(s, q) {
    if (!s || !q || q.price == null) return;
    s.close = q.price; s.change_pct = q.pct; s.volume = q.vol;
  }
  let liveCtl = null;
  const twCodes = () => viewKeys().filter((k) => k.startsWith("tw:")).map((k) => k.slice(3)).slice(0, 60);

  viewBtns.forEach((b) => b.addEventListener("click", () => setLayout(b.dataset.view)));
  let layout = "large";
  try { layout = localStorage.getItem("watch-view") || "large"; } catch (e) {}
  setLayout(["small", "large", "list"].includes(layout) ? layout : "large");
  showView(view);
  if (Holdings.count(hold, "tw") || Holdings.count(hold, "us")) loadHoldPrices();

  const maxTw = Math.max(1, w.tw.length, Holdings.count(hold, "tw"));
  liveCtl = Live.start(async () => {
    const codes = twCodes();
    if (!codes.length) return true;
    for (let i = 0; i < codes.length; i += 20) {
      const r = await Live.fetchRt(codes.slice(i, i + 20));
      Object.assign(lastQ, r.quotes);
    }
    for (const code of codes) {
      const q = lastQ[code], x = entryOf("tw:" + code);
      if (!q || !x) continue;
      setPx("tw", code, q.price);
      const key = "tw:" + code;
      const d = dataCache[key] && await dataCache[key].catch(() => null);
      if (d) {
        d._base = d._base || d.price;
        d.price = Live.mergeDaily(d._base, q, 1000);  // 富果的量是張，日線是股
        d._live = q;
        if (twCards.has(code)) ownMini(twCards.get(code), x.item);
      }
      applyQuote(listState.tw.rows && listState.tw.rows.find((s) => s.code === code), q);
    }
    if (listState.tw.rows && document.querySelector("main").classList.contains("mode-list")) renderList("tw");
    return Object.values(lastQ).some((q) => q.date === Live.twNow().date);
  }, Math.max(10000, Math.min(60, maxTw) * 2000), (s) => { document.getElementById("tw-live").innerHTML = Live.badge(s); });
})();
</script>
</body>
</html>
