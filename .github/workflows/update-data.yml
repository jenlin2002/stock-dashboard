name: 更新股票資料

on:
  schedule:
    # GitHub 用 UTC 時間；排程可能延遲幾分鐘到幾十分鐘
    - cron: "0 8 * * 1-5"    # 台灣時間週一～五 16:00：台股
    - cron: "0 22 * * 1-5"   # 台灣時間週二～六 06:00：美股（美東前一天收盤後）
  workflow_dispatch:
    inputs:
      target:
        description: "要更新哪個市場"
        type: choice
        options: [all, tw, us]
        default: all
  # 修改追蹤清單後立刻抓資料（新股票不用等到隔天）
  push:
    branches: [main]
    paths: [config/watchlist.json]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Taipei   # 讓 JSON 裡的 updated 日期用台灣時間
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 安裝套件
        run: pip install -r scripts/requirements.txt

      - name: 抓台股
        id: tw
        if: github.event.schedule == '0 8 * * 1-5' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target != 'us')
        continue-on-error: true
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/fetch_tw.py

      - name: 抓美股
        id: us
        if: github.event.schedule == '0 22 * * 1-5' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target != 'tw')
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/fetch_us.py

      - name: 彙整 summary.json
        run: python scripts/build_summary.py

      # 搜尋框用的全部股票清單：台股排程時更新（每天一次就夠）
      - name: 更新股票清單 stocklist.json
        if: github.event.schedule == '0 8 * * 1-5' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/build_stocklist.py

      # 大盤：加權、櫃買、台指期、三大法人、融資融券、期貨未平倉（FinMind，6 次請求）
      - name: 更新大盤 market.json
        if: github.event.schedule == '0 8 * * 1-5' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/build_market.py

      # 全部美股價格、市值、產業（Nasdaq 選股器，一次一個請求）：美股熱力圖用，美股收盤後那次跑
      - name: 更新全美股 all/us_stocks.json
        if: github.event.schedule == '0 22 * * 1-5' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python scripts/build_us_all.py

      # 全台股現金流量：FinMind 逐檔，每次輪流更新最久沒更新的 450 檔（約 5 天輪完）
      - name: 輪流更新現金流量 all/cashflow.json
        if: github.event.schedule == '0 8 * * 1-5' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/fetch_cashflow.py

      # 全台股總表（證交所、櫃買中心 OpenAPI，一次拿全部股票）
      - name: 更新全台股總表 all/stocks.json
        if: github.event.schedule == '0 8 * * 1-5' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python scripts/build_all.py

      # 選股器資料（均線、5／20 日漲跌、個股法人、融資、單季 EPS）：證交所、櫃買中心、公開資訊觀測站，一次拿全部股票
      # 原始歷史（近 70 個交易日價量、近 10 日法人與融資）放在 .cache/，用 actions/cache 保留；遺失時腳本會自動往回補（約 10 分鐘）
      - name: 還原選股器快取
        if: github.event.schedule == '0 8 * * 1-5' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: screener-${{ github.run_id }}
          restore-keys: screener-

      - name: 更新選股器 screener-tw.json
        if: github.event.schedule == '0 8 * * 1-5' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 20
        run: python scripts/build_screener.py

      - name: 保存選股器快取
        if: always() && hashFiles('.cache/*.json') != '' && (github.event.schedule == '0 8 * * 1-5' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: screener-${{ github.run_id }}

      - name: 有變更才 commit 並 push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "資料沒有變更"
            exit 0
          fi
          git commit -m "自動更新資料 $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push

      # 抓取失敗時，上面仍會把成功的部分存起來；這一步讓整個 workflow 顯示紅燈並寄通知信
      - name: 檢查抓取結果
        if: steps.tw.outcome == 'failure' || steps.us.outcome == 'failure'
        run: |
          echo "有市場的抓取全部失敗，請看上面「抓台股」「抓美股」步驟的紀錄"
          exit 1
